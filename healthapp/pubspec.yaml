name: health_billing
description: Healthcare billing & payments (Flutter + SQLite)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0
  url_launcher: ^6.3.0
  pdf: ^3.10.8
  printing: ^5.13.4
  barcode: ^2.2.6
  flutter_stripe: ^10.1.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - lib/data/migrations/v1.sql
